<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Публикации</title>
</head>
<body>
<h1>Список публикаций</h1>
<button onclick="loadPosts()">Загрузить</button>
<div id="result"></div>
<script>
    async function loadPosts() {
        let result = document.getElementById("result");
        result.textContent = "Загрузка...";
        try {
            let response = await fetch("https://jsonplaceholder.typicode.com/posts?_limit=10");
            if (!response.ok) {
                throw new Error("Ошибка");
            }
            let posts = await response.json();
            result.textContent = "";
            for (let post of posts) {
                let p = document.createElement("p");
                p.textContent = post.id + ". " + post.title;
                result.appendChild(p);
            }
        } catch (error) {
            result.textContent = "Ошибка загрузки";
        }
    }
</script>
</body>
</html>
