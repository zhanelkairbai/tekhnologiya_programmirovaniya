<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Список задач</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>
<body>
    <h1>Список задач</h1>
    <button id="btn">Загрузить задачи</button>
    <br><br>
    <label>Введите ID пользователя от 1 до 10:</label>
    <input type="number" id="userId" min="1" max="10">
    <button id="filter">Фильтр</button>
    <p id="status"></p>
    <p id="count"></p>
    <div id="result"></div>
</body>
</html>
